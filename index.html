<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://pyscript.net/releases/2024.1.1/core.css">
    <script type="module" src="https://pyscript.net/releases/2024.1.1/core.js"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Montserrat:wght@600;800&display=swap" rel="stylesheet">
    <title>76ers Training Facility - Seatwork 2</title>
    <style>
        :root {
            --sixers-blue: #006bb6;
            --sixers-red: #ed174c;
            --court-wood: #1d120c;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            font-family: 'Montserrat', sans-serif;
            color: #ffffff;
            background-color: var(--court-wood);
            background-image: 
                linear-gradient(90deg, rgba(240, 180, 100, 0.03) 50%, transparent 50%),
                linear-gradient(rgba(0, 0, 0, 0.5) 1px, transparent 1px);
            background-size: 80px 80px, 100% 12px;
            padding: 1rem;
        }

        header {
            text-align: center;
            margin-bottom: 1.5rem;
        }

        .reactor {
            width: 50px;
            height: 50px;
            margin: 0 auto 0.5rem;
            background: var(--sixers-blue);
            border: 2px solid var(--sixers-red);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: 'Bebas Neue', cursive;
            font-size: 1.5rem;
            color: #fff;
        }

        header h1 {
            font-family: 'Bebas Neue', cursive;
            font-size: 2.4rem;
            letter-spacing: 0.08em;
            color: #ffffff;
            text-transform: uppercase;
        }

        header p {
            font-size: 0.75rem;
            font-weight: 800;
            letter-spacing: 0.15em;
            color: #94a3b8;
            text-transform: uppercase;
        }

        form {
            width: 100%;
            max-width: 400px;
            background: #0f172a;
            border: 2px solid var(--sixers-blue);
            border-radius: 12px;
            padding: 2rem;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.8);
        }

        form input[type="text"] {
            width: 100%;
            margin-bottom: 1rem;
            padding: 0.85rem 1rem;
            font-family: 'Montserrat', sans-serif;
            font-size: 1rem;
            font-weight: 600;
            color: #fff;
            background: #020617;
            border: 1px solid #334155;
            border-radius: 6px;
            outline: none;
        }

        form input[type="text"]:focus {
            border-color: var(--sixers-blue);
        }

        form input[type="button"] {
            width: 100%;
            padding: 0.9rem;
            font-family: 'Bebas Neue', cursive;
            font-size: 1.3rem;
            letter-spacing: 0.1em;
            text-transform: uppercase;
            color: #fff;
            background: var(--sixers-blue);
            border: none;
            border-radius: 6px;
            cursor: pointer;
        }

        form input[type="button"]:hover {
            background: var(--sixers-red);
        }

        #result {
            width: 100%;
            max-width: 400px;
            margin-top: 1rem;
            padding: 1rem;
            text-align: center;
            font-size: 0.95rem;
            font-weight: 700;
            background: #0f172a;
            border: 1px solid #334155;
            border-radius: 6px;
        }

        #result:empty { display: none; }

        footer {
            margin-top: 1.5rem;
            text-align: center;
            font-size: 0.75rem;
            letter-spacing: 0.1em;
            color: #64748b;
            text-transform: uppercase;
        }

        footer span { color: var(--sixers-red); }
    </style>
</head>
<body>
    <header>
        <div class="reactor">76</div>
        <h1>76ers Facility Checker</h1>
        <p>Candidate Verification System</p>
    </header>

    <main>
        <form>
            <input type="text" id="first_name" placeholder="Enter your First Name"><br>
            <input type="text" id="last_name" placeholder="Enter your Last Name"><br>
            <input type="button" py-click="candidate_checker" value="Enter">
        </form>
        <div id="result"></div>
    </main>

    <footer>
        &copy; 2026 <span>Philadelphia 76ers</span> &bull; Seatwork 2 &bull; 2nd Quarter
    </footer>

    <py-script src="main.py"></py-script>
</body>
</html>
